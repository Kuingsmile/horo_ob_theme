name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('manifest.json version must use the x.y.z format.');
          }
          if (process.env.GITHUB_REF_NAME !== version) {
            throw new Error(`Release tag must exactly match manifest.json version (${version}).`);
          }
          if (!fs.statSync('theme.css').isFile() || fs.statSync('theme.css').size === 0) {
            throw new Error('theme.css must be a non-empty file.');
          }
          NODE

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            manifest.json theme.css \
            --verify-tag \
            --title "Horo $GITHUB_REF_NAME" \
            --generate-notes
